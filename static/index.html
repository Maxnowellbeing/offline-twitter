<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Blog</title>
    <link rel="preconnect" href="https://fonts.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Nav -->
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" onclick="navigateTo('home')">
                <span class="logo"></span>
                <span>Offline Blog</span>
            </a>
            <nav class="nav" id="main-nav">
                <a class="nav-a active" data-page="home" onclick="navigateTo('home')">首页</a>
                <a class="nav-a" data-page="explore" onclick="navigateTo('explore')">搜索</a>
                <a class="nav-a" data-page="media" onclick="navigateTo('media')">媒体库</a>
                <a class="nav-a" data-page="follows" onclick="navigateTo('follows')">关注</a>
                <a class="nav-a" data-page="favorites" onclick="navigateTo('favorites')">收藏</a>
            </nav>
            <div class="actions">
                <button class="btn-add" onclick="showAddFollow()">+ 关注</button>
                <button class="btn-refresh" onclick="refreshAll()" title="刷新全部">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                </button>
                <button class="btn-refresh" onclick="showCookies()" title="Cookie 设置">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Home -->
        <div id="page-home" class="page active">
            <div class="grid">
                <section class="posts" id="timeline"></section>
                <aside class="sidebar" id="home-sidebar"></aside>
            </div>
        </div>

        <!-- User Profile -->
        <div id="page-user" class="page">
            <div class="grid">
                <section class="posts" id="user-posts"></section>
                <aside class="sidebar" id="user-sidebar"></aside>
            </div>
        </div>

        <!-- Search -->
        <div id="page-explore" class="page">
            <div class="grid">
                <section class="posts">
                    <div class="search-hero">
                        <h2>搜索内容</h2>
                        <div class="search-bar">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                            <input type="text" id="search-input" placeholder="输入关键词搜索..." onkeydown="if(event.key==='Enter')searchTweets()">
                            <button onclick="searchTweets()">搜索</button>
                        </div>
                    </div>
                    <div id="search-results"></div>
                </section>
                <aside class="sidebar" id="explore-sidebar"></aside>
            </div>
        </div>

        <!-- Media -->
        <div id="page-media" class="page">
            <div class="grid">
                <section class="posts">
                    <div class="media-header">
                        <h2>媒体库</h2>
                        <div class="filter-tabs">
                            <button class="ftab active" onclick="filterMedia('all',this)">全部</button>
                            <button class="ftab" onclick="filterMedia('photo',this)">图片</button>
                            <button class="ftab" onclick="filterMedia('video',this)">视频</button>
                        </div>
                    </div>
                    <div id="media-gallery" class="masonry"></div>
                </section>
                <aside class="sidebar" id="media-sidebar"></aside>
            </div>
        </div>

        <!-- Follows -->
        <div id="page-follows" class="page">
            <div class="grid">
                <section class="posts" id="follow-list"></section>
                <aside class="sidebar" id="follows-sidebar"></aside>
            </div>
        </div>

        <!-- Favorites -->
        <div id="page-favorites" class="page">
            <div class="grid">
                <section class="posts" id="favorites-list"></section>
                <aside class="sidebar" id="favorites-sidebar"></aside>
            </div>
        </div>
    </div>

    <!-- Modal: Add Follow -->
    <div id="modal-follow" class="overlay" style="display:none">
        <div class="modal">
            <h3>关注新博主</h3>
            <input type="text" id="follow-username" placeholder="推特用户名（如 @elonmusk）">
            <input type="number" id="follow-count" value="200" placeholder="抓取数量">
            <div class="modal-actions">
                <button class="btn-ghost" onclick="closeModal()">取消</button>
                <button class="btn-primary" onclick="addFollow()">关注</button>
            </div>
        </div>
    </div>

    <!-- Modal: Cookie Settings -->
    <div id="modal-cookies" class="overlay" style="display:none">
        <div class="modal">
            <h3>Cookie 设置</h3>
            <div id="cookie-status" class="cookie-status"></div>
            <label class="input-label">AUTH_TOKEN</label>
            <input type="text" id="cookie-auth" placeholder="粘贴新的 AUTH_TOKEN...">
            <label class="input-label">CT0</label>
            <input type="text" id="cookie-ct0" placeholder="粘贴新的 CT0...">
            <label class="input-label">代理地址</label>
            <input type="text" id="cookie-proxy" placeholder="http://127.0.0.1:7897">
            <div class="modal-actions">
                <button class="btn-ghost" onclick="closeCookies()">取消</button>
                <button class="btn-primary" onclick="saveCookies()">保存</button>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="overlay" style="display:none" onclick="closeLightbox(event)">
        <button class="lb-close" onclick="closeLightbox()">&times;</button>
        <button class="lb-arrow lb-prev" onclick="event.stopPropagation();lbNav(-1)">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="lb-arrow lb-next" onclick="event.stopPropagation();lbNav(1)">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div id="lb-counter" class="lb-counter"></div>
        <div id="lightbox-content"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
